packages:
  - .

# Host packages are pinned exactly in devDependencies so the compiler sees one
# copy of each DSH package and of schemastery (duplicates cause TS2883).
autoInstallPeers: false

# esbuild's postinstall is needed by vite (through vitest) and tsdown.
allowBuilds:
  esbuild: true

# Workspace-local store: agent sandboxes only allow writes inside the project.
storeDir: .pnpm-store

# First-party host SDK packages are pinned exactly in devDependencies and the
# lockfile; allow adopting a DSH release on its publish day.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
