# dsh-pdf-mineru bundle layer. Values below are first-boot composition defaults;
# later edits persist through the DSH settings service.
- insert:
    - id: dsh-pdf-mineru
      name: 'dsh-pdf-mineru'
      config:
        schemaVersion: 3
        activeProvider: mp_self_hosted
        providers:
          - id: mp_self_hosted
            type: self-hosted-legacy-v2
            baseURL: 'http://localhost:18000'
            apiKeyEnv: MINERU_API_KEY
            allowInsecureHttp: true
            modelMap:
              pipeline: pipeline
              vlm: vlm-engine
          - id: mp_official
            type: official-v4
            baseURL: 'https://mineru.net/api/v4'
            apiKeyEnv: MINERU_API_KEY
            models:
              - pipeline
              - vlm
            configuredVersion: v4
          - id: mp_self_hosted_v1
            type: self-hosted-v1
            baseURL: 'http://localhost:8000'
            apiKeyEnv: MINERU_API_KEY
            allowInsecureHttp: true
            ocrMode: auto
        defaults:
          model: pipeline
          ocr: false
          parseMethod: auto
          language: ch
          formula: true
          table: true
        retry:
          maxAttempts: 3
          baseDelayMs: 500
          maxDelayMs: 10000
