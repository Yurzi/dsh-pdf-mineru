# dsh-pdf-mineru bundle layer. Values below are first-boot composition defaults;
# later edits persist through the DSH settings service.
- insert:
    - id: dsh-pdf-mineru
      name: 'dsh-pdf-mineru'
      config:
        schemaVersion: 1
        activeProvider: mp_self_hosted
        providers:
          - id: mp_self_hosted
            type: self-hosted-v2
            baseURL: 'http://localhost:18000'
            apiKeyEnv: MINERU_API_KEY
            allowInsecureHttp: true
            modelMap:
              pipeline: pipeline
              vlm: vlm-engine
        defaults:
          model: pipeline
          ocr: false
          parseMethod: auto
          language: ch
          formula: true
          table: true
          artifacts:
            - markdown
